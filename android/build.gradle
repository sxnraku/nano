// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Force Java 21 for all modules to avoid toolchain issues
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
                if (project.plugins.hasPlugin('kotlin-android')) {
                    kotlinOptions {
                        jvmTarget = '21'
                    }
                }
            }
        }
    }

    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'androidx.activity') {
                    details.useVersion '1.8.2'
                }
                if (details.requested.group == 'androidx.core' && (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
                    details.useVersion '1.12.0'
                }
                if (details.requested.group == 'androidx.core' && details.requested.name == 'core-splashscreen') {
                    details.useVersion '1.0.1'
                }
                if (details.requested.group == 'androidx.appcompat') {
                    details.useVersion '1.6.1'
                }
                if (details.requested.group == 'androidx.fragment') {
                    details.useVersion '1.6.2'
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
